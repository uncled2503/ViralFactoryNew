apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viralfactory-ingress
  namespace: viralfactory
  labels:
    app: coordinator
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Allow large media file uploads (raw video materials up to 500MB)
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    # Secure WebSocket and long-polling connection settings (critical for coordinator worker registration)
    nginx.ingress.kubernetes.io/websocket-services: "coordinator-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Performance tuning
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/connection-proxy-header: "keep-alive"
spec:
  rules:
    - host: viralfactory.enterprise.com # Replace with your corporate domain (e.g., app.viralfactory.io)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coordinator-service
                port:
                  number: 3000
