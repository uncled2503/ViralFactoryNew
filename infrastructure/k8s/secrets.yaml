apiVersion: v1
kind: Secret
metadata:
  name: viralfactory-secrets
  namespace: viralfactory
  labels:
    app: viralfactory
    environment: production
type: Opaque
data:
  # =========================================================================
  # IMPORTANT INSTRUCTIONS FOR PRODUCTION DEPLOYMENT:
  # These values are base64 encoded. To generate values, run:
  # echo -n "your-secret-value" | base64
  # Replace these base64 placeholders with your real environment credentials.
  # =========================================================================

  # VITE_SUPABASE_URL placeholder (base64-encoded empty string or mock url)
