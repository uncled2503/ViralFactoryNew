  # SUPABASE_SERVICE_ROLE_KEY placeholder (base64-encoded mock key)
  SUPABASE_SERVICE_ROLE_KEY: "ZXlKaGJHY2lPaUpJVXpFeU1pSjkuZXlKaFpXNWpZVzRpT2lKbllXNXVaVzVsY0NJc0ltbHpaVzFwZEhNaU9pSmxiV0ZpYkdWemN5Sjku..." # base64 placeholder
  
  # GEMINI_API_KEY placeholder (base64-encoded mock key)
  GEMINI_API_KEY: "QUl6YVN5RHBfTVRSRV9tcXNnd2t6OTI4X2Fza2pq" # base64 of "AIzaSyDp_MTRE_mqsgwkz928_askjj"

  # Optional REDIS_PASSWORD (base64-encoded blank value by default)
  REDIS_PASSWORD: ""
